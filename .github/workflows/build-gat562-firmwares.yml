name: Build GAT562 Firmwares

permissions:
  contents: read

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - model: MeshCore_GAT562_Family
            environment: GAT562_Mesh_Tracker_Pro_companion_radio_ble
            t9: false
            ch: false
          - model: MeshCore_GAT562_Family_CH
            environment: GAT562_Mesh_Tracker_Pro_CH_companion_radio_ble
            t9: false
            ch: true
          - model: MeshCore_GAT562_T9
            environment: GAT562_Mesh_Tracker_Pro_T9_companion_radio_ble
            t9: true
            ch: false
          - model: MeshCore_GAT562_T9_CH
            environment: GAT562_Mesh_Tracker_Pro_T9_CH_companion_radio_ble
            t9: true
            ch: true
          - model: MeshCore_GAT562_T9_TW
            environment: GAT562_Mesh_Tracker_Pro_T9_TW_companion_radio_ble
            t9: true
            ch: false
            tw: true

    name: ${{ matrix.model }}

    steps:
      - name: Clone repository
        uses: actions/checkout@v6

      - name: Test alarm scheduling and storage
        run: |
          g++ -std=c++11 -Wall -Wextra -Werror -fsanitize=address,undefined bin/tests/test_gat562_alarm.cpp -o /tmp/test_gat562_alarm
          /tmp/test_gat562_alarm
          g++ -std=c++11 -Wall -Wextra -Werror -fsanitize=address,undefined -DGAT562_CH_UI=1 bin/tests/test_gat562_alarm.cpp -o /tmp/test_gat562_alarm_ch
          /tmp/test_gat562_alarm_ch

      - name: Setup build environment
        uses: ./.github/actions/setup-build-environment

      - name: Test T9 input modes
        shell: bash
        run: |
          set -euo pipefail
          for mode in EN CH TW; do
            flags=()
            if [[ "$mode" == CH ]]; then flags+=(-DGAT562_CH_UI=1); fi
            if [[ "$mode" == TW ]]; then flags+=(-DGAT562_TW_UI=1 -DZHUYIN_SINGLE_CHAR=1); fi
            g++ -std=c++17 -Wall -Wextra -fsanitize=address,undefined -Ibin/tests/ime_stubs "${flags[@]}" bin/tests/test_gat562_input.cpp -o /tmp/test_gat562_input
            /tmp/test_gat562_input
          done

      - name: Build firmware
        run: pio run -e "${{ matrix.environment }}"

      - name: Verify and package firmware
        env:
          BUILD_ENV: ${{ matrix.environment }}
          MODEL: ${{ matrix.model }}
          T9_ENABLED: ${{ matrix.t9 }}
          CH_ENABLED: ${{ matrix.ch }}
          TW_ENABLED: ${{ matrix.tw }}
        shell: bash
        run: |
          set -euo pipefail

          build_dir=".pio/build/${BUILD_ENV}"
          output_dir="out/${MODEL}"
          symbols="${RUNNER_TEMP}/${MODEL}.symbols"
          firmware_bin="${RUNNER_TEMP}/${MODEL}.bin"
          nm_bin="$(find "${HOME}/.platformio/packages" -name arm-none-eabi-nm -print -quit)"

          mkdir -p "${output_dir}"
          test -n "${nm_bin}"

          "${nm_bin}" -C "${build_dir}/firmware.elf" > "${symbols}"

          unzip -p "${build_dir}/firmware.zip" firmware.bin > "${firmware_bin}"
          python bin/uf2conv/uf2conv.py \
            -f 0xADA52840 \
            -c "${build_dir}/firmware.hex" \
            -o "${output_dir}/${MODEL}.uf2"
          cp "${build_dir}/firmware.zip" "${output_dir}/${MODEL}_OTA.zip"

          require_symbol() {
            if ! grep -Fq "$1" "${symbols}"; then
              echo "Missing required firmware symbol: $1"
              grep -Ei "tinyusb|tud_|usbd_cdc|gat562t9" "${symbols}" | head -n 100 || true
              return 1
            fi
          }

          require_symbol "TinyUSB_Device_Init"
          require_symbol "tud_descriptor_device_cb"
          require_symbol "Adafruit_USBD_CDC::begin"
          require_symbol "UITask::pollAlarms"

          if [[ "${T9_ENABLED}" == "true" ]]; then
            require_symbol "GAT562T9Keyboard::poll"
            require_symbol "GAT562T9Editor::handleInput"
          elif grep -Fq "GAT562T9Keyboard::poll" "${symbols}"; then
            echo "Unexpected T9 keyboard code in family firmware"
            exit 1
          fi

          if [[ "${CH_ENABLED}" == "true" ]]; then
            require_symbol "pinyin_simple_search"
            require_symbol "utf8_10x10_map"
          elif [[ "${TW_ENABLED}" == "true" ]]; then
            require_symbol "BPMF_CAND_DATA"
            require_symbol "utf8_10x10_map"
            if grep -Fq "pinyin_simple_search" "${symbols}"; then exit 1; fi
          elif grep -Eq "pinyin_simple_search|utf8_10x10_map" "${symbols}"; then
            echo "Unexpected Chinese UI code in non-CH firmware"
            exit 1
          fi

          python - "${firmware_bin}" <<'PY'
          import pathlib
          import sys

          data = pathlib.Path(sys.argv[1]).read_bytes()
          assert b"\x12\x01\x00\x02" in data, "USB device descriptor is missing"
          assert b"\x9a\x23\x29\x80" in data, "USB VID/PID is missing"
          PY

          python bin/uf2conv/uf2conv.py -i "${output_dir}/${MODEL}.uf2"

      - name: Upload firmware
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.model }}
          path: out/${{ matrix.model }}
          if-no-files-found: error
          retention-days: 30
